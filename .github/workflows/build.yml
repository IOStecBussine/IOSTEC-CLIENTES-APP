name: IOSTEC CLIENTES APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Crear estructura Android
        run: flutter create --platforms=android --org com.iostec --project-name clientes .

      - name: Instalar dependencias
        run: flutter pub get

      - name: Generar APK
        run: flutter build apk --release

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: IOSTEC-CLIENTES-APK
          path: build/app/outputs/flutter-apk/app-release.apk
